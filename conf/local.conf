# conf/local.conf
#
# Local build configuration for YCM4R1.
# This file is used when building WITHOUT kas (i.e. with the classic
# oe-init-build-env approach). If you are using kas, all settings below are
# already provided by kas/ycm4r1.yml and this file acts as a reference.

# ── Target machine ────────────────────────────────────────────────────────────
# The CM4 shares the BCM2711 SoC with the Raspberry Pi 4; the upstream
# raspberrypi4-64 machine includes the CM4 device-tree blob.
MACHINE ?= "raspberrypi4-64"

# ── Distribution ─────────────────────────────────────────────────────────────
DISTRO ?= "poky"

# ── Package format ────────────────────────────────────────────────────────────
PACKAGE_CLASSES ?= "package_ipk"

# ── Build parallelism ─────────────────────────────────────────────────────────
BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
PARALLEL_MAKE     ?= "-j ${@oe.utils.cpu_count()}"

# ── Downloads / sstate cache ─────────────────────────────────────────────────
# Adjust these paths if you want a shared download/sstate cache across builds.
#DL_DIR ?= "${TOPDIR}/../downloads"
#SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

# ── SDK / extra image features ────────────────────────────────────────────────
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

# ── Raspberry Pi specific ─────────────────────────────────────────────────────
ENABLE_UART = "1"

# ── WiFi (BCM43455 on CM4) ────────────────────────────────────────────────────
MACHINE_FEATURES:append = " wifi"
DISTRO_FEATURES:append  = " wifi"

# Accept Broadcom firmware commercial license.
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch commercial_brcm43455"

# ── ROS 1 Noetic ──────────────────────────────────────────────────────────────
ROS_DISTRO = "noetic"
ROS_OE_RELEASE_SERIES = "kirkstone"

# ── Miscellaneous ─────────────────────────────────────────────────────────────
# Verbose build output (set to "1" for quieter builds).
BUILDHISTORY_COMMIT ?= "0"
CONF_VERSION = "2"
