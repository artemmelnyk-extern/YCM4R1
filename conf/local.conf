# conf/local.conf
#
# Local build configuration for YCM4R1.
# This file is used when building WITHOUT kas (i.e. with the classic
# oe-init-build-env approach). If you are using kas, all settings below are
# already provided by kas/ycm4r1.yml and this file acts as a reference.

# ── Target machine ────────────────────────────────────────────────────────────
# Use the upstream raspberrypi-cm3 definition from meta-raspberrypi, or the
# custom raspberrypi-cm3-wifi machine from meta-ycm4r1 for pre-configured WiFi.
MACHINE ?= "raspberrypi-cm3"

# ── Distribution ─────────────────────────────────────────────────────────────
DISTRO ?= "poky"

# ── Package format ────────────────────────────────────────────────────────────
PACKAGE_CLASSES ?= "package_ipk"

# ── Build parallelism ─────────────────────────────────────────────────────────
BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
PARALLEL_MAKE     ?= "-j ${@oe.utils.cpu_count()}"

# ── Downloads / sstate cache ─────────────────────────────────────────────────
# Adjust these paths if you want a shared download/sstate cache across builds.
#DL_DIR ?= "${TOPDIR}/../downloads"
#SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

# ── SDK / extra image features ────────────────────────────────────────────────
EXTRA_IMAGE_FEATURES ?= "debug-tweaks ssh-server-openssh"

# ── Raspberry Pi specific ─────────────────────────────────────────────────────
ENABLE_UART = "1"

# ── WiFi (BCM43455 on CM3+ Lite WiFi) ────────────────────────────────────────
MACHINE_FEATURES_append = " wifi"
DISTRO_FEATURES_append  = " wifi"

# Accept Broadcom firmware commercial license.
LICENSE_FLAGS_WHITELIST = "synaptics-killswitch commercial_brcm43455"

# ── ROS 1 Melodic ─────────────────────────────────────────────────────────────
ROS_DISTRO = "melodic"
ROS_OE_RELEASE_SERIES = "warrior"

# ── Miscellaneous ─────────────────────────────────────────────────────────────
# Verbose build output (set to "1" for quieter builds).
BUILDHISTORY_COMMIT ?= "0"
CONF_VERSION = "1"
