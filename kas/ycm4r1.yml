# KAS configuration file for YCM4R1
# Builds Yocto Linux with ROS 1 Noetic for Raspberry Pi Compute Module 4 (CM4)
# with 4 GB RAM, 32 GB eMMC and onboard WiFi (BCM43455).
#
# Prerequisites: kas >= 3.0 installed on the host.
# Usage:
#   kas build kas/ycm4r1.yml
# or, to drop into an interactive shell:
#   kas shell kas/ycm4r1.yml

header:
  version: 14

machine: raspberrypi4-64
distro: poky
target: ycm4r1-image

repos:
  # ── Poky (Yocto 4.0 / kirkstone) ──────────────────────────────────────────
  poky:
    url: https://git.yoctoproject.org/git/poky
    branch: kirkstone
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  # ── OpenEmbedded layers ────────────────────────────────────────────────────
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: kirkstone
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  # ── Raspberry Pi BSP ──────────────────────────────────────────────────────
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: kirkstone
    layers:
      meta-raspberrypi:

  # ── ROS 1 Noetic ──────────────────────────────────────────────────────────
  # meta-ros kirkstone branch ships ROS 1 Noetic generated recipes.
  meta-ros:
    url: https://github.com/ros/meta-ros
    branch: kirkstone
    layers:
      meta-ros-common:
      meta-ros1:
      meta-ros1-noetic:

  # ── Project-specific layer ─────────────────────────────────────────────────
  meta-ycm4r1:
    path: meta-ycm4r1
    layers:
      meta-ycm4r1:

local_conf_header:
  standard: |
    # ── Build parallelism ──────────────────────────────────────────────────
    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE     ?= "-j ${@oe.utils.cpu_count()}"

    # ── Package format ─────────────────────────────────────────────────────
    PACKAGE_CLASSES = "package_ipk"

    # ── SDK / extra image features ─────────────────────────────────────────
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

    # ── Raspberry Pi specific ──────────────────────────────────────────────
    # Enable UART so that early boot messages are visible on the serial console.
    ENABLE_UART = "1"

    # ── WiFi ───────────────────────────────────────────────────────────────
    # Broadcom 43455 WiFi chip fitted on the CM4 module.
    MACHINE_FEATURES:append = " wifi"
    DISTRO_FEATURES:append  = " wifi"

    # ── ROS ────────────────────────────────────────────────────────────────
    ROS_DISTRO = "noetic"
    ROS_OE_RELEASE_SERIES = "kirkstone"

    # ── Misc ───────────────────────────────────────────────────────────────
    # Accept the Broadcom WiFi firmware EULA.
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch commercial_brcm43455"
    CONF_VERSION = "2"
