# Custom machine configuration for Raspberry Pi Compute Module 3+
# with onboard WiFi (BCM43455) and 16 GB eMMC.
#
# Inherits the upstream raspberrypi-cm3 definition and adds
# WiFi-specific firmware and kernel configuration fragments.

require conf/machine/raspberrypi-cm3.conf

# ── Human-readable description ───────────────────────────────────────────────
MACHINEOVERRIDES =. "raspberrypi-cm3-wifi:"

# ── WiFi firmware (Broadcom BCM43455 / CYW43455) ─────────────────────────────
# The firmware package is supplied by meta-raspberrypi.
MACHINE_EXTRA_RRECOMMENDS += " \
    linux-firmware-rpidistro-bcm43455 \
    linux-firmware-rpidistro-bcm43430 \
    brcm-patchram-plus \
"

# ── Connman / wpa_supplicant for WiFi management ─────────────────────────────
MACHINE_FEATURES += " wifi bluetooth"
