# Kernel configuration fragment: WiFi support for BCM43455 / BCM43430
# Applied to the Raspberry Pi kernel via KERNEL_CONFIG_FRAGMENTS.

CONFIG_CFG80211=y
CONFIG_CFG80211_WEXT=y
CONFIG_MAC80211=y
CONFIG_MAC80211_HAS_RC=y
CONFIG_MAC80211_RC_MINSTREL=y
CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
CONFIG_WIRELESS_EXT=y
CONFIG_WEXT_CORE=y
CONFIG_WEXT_PROC=y
CONFIG_WEXT_PRIV=y
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y
CONFIG_BRCMUTIL=m
CONFIG_RFKILL=y
CONFIG_RFKILL_INPUT=y
